<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Device - Power Monitoring</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #121826;
            --bg-card-header: #1a233a;
            --text-main: #f8f9fa;
            --text-muted: #8b9bb4;
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --grid-border: #222e4b;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
        }

        .form-card {
            border: 1px solid var(--grid-border);
            border-radius: 12px;
            background: var(--bg-card);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }

        .card-header {
            background-color: var(--bg-card-header) !important;
            border-bottom: 1px solid var(--grid-border);
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-left: 4px solid var(--neon-blue);
        }

        .form-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 8px;
            background-color: #0b0f19;
            border: 1px solid var(--grid-border);
            padding: 0.6rem 0.75rem;
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        
        .form-control:focus {
            background-color: #0b0f19;
            color: var(--text-main);
            border-color: var(--neon-blue);
            outline: 0;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }

        .btn-submit {
            border-radius: 8px;
            padding: 0.6rem 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            box-shadow: 0 0 15px rgba(0, 114, 255, 0.4);
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 22px rgba(0, 240, 255, 0.6);
            opacity: 0.95;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--grid-border);
            color: var(--text-muted);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            border-color: var(--text-muted);
            color: var(--text-main);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

<div class="container d-flex justify-content-center">
    <div class="form-card card shadow-sm">
        
        <div class="card-header py-3 text-white">
            <i class="bi bi-cpu text-info me-2"></i> System Device Registration
        </div>

        <div class="card-body p-4">
            <form method="POST" autocomplete="off">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Device ID</label>
                    <input type="text" name="device_id" class="form-control" placeholder="e.g., NODE-ESP32-01" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Device Name</label>
                    <input type="text" name="device_name" class="form-control" placeholder="e.g., Main Breaker Unit" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" class="form-control" placeholder="e.g., Server Room Rack B" required>
                </div>

                <div class="d-flex gap-3 mt-4">
                    <a href="/devices/" class="btn btn-cancel flex-shrink-0 px-3 d-flex align-items-center justify-content-center">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <button type="submit" class="btn btn-primary btn-submit text-white">
                        <i class="bi bi-plug me-2"></i> Register Device
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>

</body>
</html>
